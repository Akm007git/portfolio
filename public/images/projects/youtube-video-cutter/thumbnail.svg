<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a10"/>
      <stop offset="50%" stop-color="#140f1c"/>
      <stop offset="100%" stop-color="#1d1226"/>
    </linearGradient>
    <linearGradient id="remotionRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <!-- Ambient blur lights -->
  <circle cx="850" cy="300" r="260" fill="#e11d48" opacity="0.1" filter="blur(80px)"/>
  <circle cx="250" cy="200" r="220" fill="#8b5cf6" opacity="0.08" filter="blur(70px)"/>

  <!-- Outer Canvas container -->
  <g transform="translate(140, 90)">
    <rect width="920" height="495" rx="16" fill="#121018" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Window bar -->
    <circle cx="36" cy="32" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="56" cy="32" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="76" cy="32" r="6" fill="#10b981" opacity="0.8"/>
    <text x="110" y="37" fill="#71717a" font-family="ui-monospace, monospace" font-size="13">remotion-studio // 1080x1920 ShortVideo.tsx</text>
    <line x1="0" y1="56" x2="920" y2="56" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Vertical Video Preview Screen (Centered phone preview) -->
    <g transform="translate(355, 75)">
      <!-- Phone bezel -->
      <rect width="210" height="375" rx="28" fill="#000000" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
      
      <!-- Blurred video background inside phone -->
      <rect x="6" y="6" width="198" height="363" rx="22" fill="#2d152a"/>
      
      <!-- Hook badge -->
      <rect x="25" y="32" width="160" height="26" rx="6" fill="#e11d48"/>
      <text x="105" y="49" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="0.5">🔥 MRBEAST CHALLENGE</text>

      <!-- Centered framed video clip -->
      <rect x="18" y="90" width="174" height="110" rx="10" fill="#181822" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <circle cx="105" cy="145" r="16" fill="rgba(255,255,255,0.15)"/>
      <polygon points="101,137 113,145 101,153" fill="#ffffff"/>

      <!-- Word-level Animated Captions -->
      <g transform="translate(25, 230)">
        <rect width="160" height="60" rx="8" fill="rgba(0,0,0,0.6)"/>
        <text x="80" y="26" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="800" font-size="12" text-anchor="middle">HOW DID HE</text>
        <text x="80" y="46" fill="#facc15" font-family="ui-sans-serif, system-ui" font-weight="900" font-size="14" text-anchor="middle">PULL THIS OFF?!</text>
      </g>

      <!-- Progress bar -->
      <rect x="20" y="340" width="170" height="4" rx="2" fill="rgba(255, 255, 255, 0.2)"/>
      <rect x="20" y="340" width="95" height="4" rx="2" fill="#e11d48"/>
    </g>

    <!-- Left info panel -->
    <g transform="translate(45, 95)">
      <text x="0" y="30" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="12" font-weight="600">PROGRAMMATIC RENDERING</text>
      <text x="0" y="65" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="22">Remotion + React 19</text>
      <text x="0" y="95" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="13">Automated vertical short generation:</text>

      <rect y="115" width="270" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="142" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">✓ 1080×1920 9:16 Canvas</text>

      <rect y="172" width="270" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="199" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">✓ @remotion/captions</text>

      <rect y="229" width="270" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="256" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">✓ Ambient Background Fill</text>
    </g>

    <!-- Right info panel -->
    <g transform="translate(615, 95)">
      <text x="0" y="30" fill="#a855f7" font-family="ui-monospace, monospace" font-size="12" font-weight="600">EXPORT ENGINE</text>
      <text x="0" y="65" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="22">Bun + FFmpeg</text>
      <text x="0" y="95" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="13">High-speed programmatic export:</text>

      <rect y="115" width="260" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="142" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">⚡ Sub-minute rendering</text>

      <rect y="172" width="260" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="199" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">⚡ Word-level timestamps</text>

      <rect y="229" width="260" height="46" rx="8" fill="#181520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="256" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">⚡ Headless CLI batches</text>
    </g>
  </g>

  <!-- Title banner -->
  <text x="140" y="625" fill="#f4f4f5" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">YouTube Video Cutter</text>
  <text x="440" y="625" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="14">Remotion 4 • React 19 • TypeScript • FFmpeg • Bun</text>
</svg>
