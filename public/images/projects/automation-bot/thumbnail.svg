<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="50%" stop-color="#0e141a"/>
      <stop offset="100%" stop-color="#121e24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>
  <circle cx="600" cy="320" r="280" fill="#10b981" opacity="0.08" filter="blur(90px)"/>

  <!-- Mock Interface Card -->
  <g transform="translate(140, 90)">
    <rect width="920" height="495" rx="16" fill="#101518" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Window bar -->
    <circle cx="36" cy="32" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="56" cy="32" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="76" cy="32" r="6" fill="#10b981" opacity="0.8"/>
    <text x="110" y="37" fill="#71717a" font-family="ui-monospace, monospace" font-size="13">automation-bot // daemon-orchestrator [IN PROGRESS]</text>
    <line x1="0" y1="56" x2="920" y2="56" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Main Bot Terminal & Dashboard -->
    <g transform="translate(40, 85)">
      <!-- Left side: Execution log -->
      <rect width="520" height="370" rx="10" fill="#080b0d" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <g transform="translate(20, 30)">
        <text x="0" y="0" fill="#34d399" font-family="ui-monospace, monospace" font-size="13">[DAEMON] Autonomous Task Engine Initialized</text>
        <text x="0" y="30" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">&gt; Polling triggers... active</text>
        <text x="0" y="55" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">&gt; Sync target: Enterprise Endpoints</text>
        <text x="0" y="80" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="12">&gt; Routine verification: PASSED [0 errors]</text>
        <text x="0" y="115" fill="#34d399" font-family="ui-monospace, monospace" font-size="12">[TASK 101] Automated sync pipeline running</text>
        <text x="0" y="140" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">  - Fetching delta payload... done</text>
        <text x="0" y="165" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">  - Applying transformation schema... done</text>
        <text x="0" y="190" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">  - Writing state verification to database</text>
        <text x="0" y="230" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12">STATUS: Active Development / In Progress</text>
      </g>

      <!-- Right side: Metrics & Status -->
      <g transform="translate(550, 0)">
        <rect width="290" height="110" rx="10" fill="#141a1e" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="20" y="36" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600">BOT STATUS</text>
        <text x="20" y="75" fill="#10b981" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="24">Active Dev</text>

        <rect y="130" width="290" height="110" rx="10" fill="#141a1e" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="20" y="166" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600">WORKFLOW TYPE</text>
        <text x="20" y="205" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">Autonomous</text>

        <rect y="260" width="290" height="110" rx="10" fill="#141a1e" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="20" y="296" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="600">ERROR TOLERANCE</text>
        <text x="20" y="335" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">Self-Healing</text>
      </g>
    </g>
  </g>

  <!-- Title banner -->
  <text x="140" y="625" fill="#f4f4f5" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">Automation Bot</text>
  <text x="360" y="625" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="14">Python • Automation • Bots • Workflow Orchestration</text>
</svg>
