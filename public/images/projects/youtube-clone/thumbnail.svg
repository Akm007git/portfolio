<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <circle cx="600" cy="300" r="280" fill="#3b82f6" opacity="0.08" filter="blur(90px)"/>

  <!-- Mock Web Browser window -->
  <g transform="translate(140, 90)">
    <rect width="920" height="495" rx="16" fill="#121216" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Window bar -->
    <circle cx="36" cy="32" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="56" cy="32" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="76" cy="32" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="130" y="18" width="500" height="28" rx="6" fill="#1c1c24"/>
    <text x="150" y="37" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">https://youtube-clone.app/feed/trending</text>
    <line x1="0" y1="56" x2="920" y2="56" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Left sidebar -->
    <g transform="translate(24, 75)">
      <rect width="160" height="395" rx="8" fill="#17171e"/>
      <text x="16" y="30" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="600" font-size="13">Home</text>
      <text x="16" y="60" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="13">Explore</text>
      <text x="16" y="90" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="13">Subscriptions</text>
      <text x="16" y="120" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-size="13">Library</text>
    </g>

    <!-- Main video feed grid -->
    <g transform="translate(205, 75)">
      <!-- Large featured video -->
      <rect width="690" height="220" rx="10" fill="#1a1a24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="345" cy="110" r="28" fill="rgba(255, 255, 255, 0.15)"/>
      <polygon points="340,98 356,110 340,122" fill="#ffffff"/>
      <text x="24" y="200" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="16">Video Streaming Engine UI</text>

      <!-- Video cards row below -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="220" height="140" rx="8" fill="#181822"/>
        <rect x="10" y="10" width="200" height="90" rx="6" fill="#242432"/>
        <text x="10" y="120" fill="#e4e4e7" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600">Video Player Component</text>

        <rect x="235" y="0" width="220" height="140" rx="8" fill="#181822"/>
        <rect x="245" y="10" width="200" height="90" rx="6" fill="#242432"/>
        <text x="245" y="120" fill="#e4e4e7" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600">Search &amp; Query Filter</text>

        <rect x="470" y="0" width="220" height="140" rx="8" fill="#181822"/>
        <rect x="480" y="10" width="200" height="90" rx="6" fill="#242432"/>
        <text x="480" y="120" fill="#e4e4e7" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600">Channel Metadata UI</text>
      </g>
    </g>
  </g>

  <!-- Title banner -->
  <text x="140" y="625" fill="#f4f4f5" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">YouTube Clone</text>
  <text x="360" y="625" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="14">React • TypeScript • Tailwind CSS • Video Streaming UI</text>
</svg>
