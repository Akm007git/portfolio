<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12121e"/>
      <stop offset="100%" stop-color="#1a152e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background with subtle grid -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient light glow -->
  <circle cx="900" cy="200" r="280" fill="#6366f1" opacity="0.12" filter="blur(80px)"/>
  <circle cx="300" cy="500" r="220" fill="#a855f7" opacity="0.08" filter="blur(60px)"/>

  <!-- Mock Interface Card -->
  <g transform="translate(140, 100)">
    <rect width="920" height="475" rx="16" fill="#13131a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Window controls -->
    <circle cx="36" cy="36" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="56" cy="36" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="76" cy="36" r="6" fill="#10b981" opacity="0.8"/>
    <text x="110" y="41" fill="#71717a" font-family="ui-monospace, monospace" font-size="13">ai-job-search // autonomous-agent-pipeline</text>
    <line x1="0" y1="64" x2="920" y2="64" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Content columns -->
    <g transform="translate(40, 95)">
      <!-- Left side: stats -->
      <rect width="360" height="310" rx="12" fill="#181822" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
      <text x="24" y="40" fill="#818cf8" font-family="ui-sans-serif, system-ui" font-weight="600" font-size="14" letter-spacing="1">AGENT WORKFLOW STATUS</text>
      <text x="24" y="80" fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="28">170+ Postings / Day</text>
      
      <g transform="translate(24, 115)">
        <rect width="312" height="40" rx="8" fill="#20202e"/>
        <circle cx="20" cy="20" r="5" fill="#10b981"/>
        <text x="36" y="24" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">LinkedIn &amp; Instahyre Scraper: LIVE</text>
      </g>
      <g transform="translate(24, 168)">
        <rect width="312" height="40" rx="8" fill="#20202e"/>
        <circle cx="20" cy="20" r="5" fill="#6366f1"/>
        <text x="36" y="24" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">5-Dim Fit Scorer: GEMINI 2.0</text>
      </g>
      <g transform="translate(24, 221)">
        <rect width="312" height="40" rx="8" fill="#20202e"/>
        <circle cx="20" cy="20" r="5" fill="#a855f7"/>
        <text x="36" y="24" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">LaTeX Resume Engine: ATS VERIFIED</text>
      </g>

      <!-- Right side: Flow Diagram -->
      <g transform="translate(400, 0)">
        <rect width="440" height="310" rx="12" fill="#181822" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <text x="24" y="40" fill="#a1a1aa" font-family="ui-sans-serif, system-ui" font-weight="600" font-size="14">AUTONOMOUS /apply PIPELINE</text>

        <!-- Step 1 -->
        <rect x="24" y="65" width="392" height="58" rx="8" fill="#1e1e2d" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
        <text x="44" y="94" fill="#818cf8" font-family="ui-monospace, monospace" font-weight="600" font-size="13">01 // Multi-Portal Ingestion</text>
        <text x="44" y="112" fill="#71717a" font-family="ui-sans-serif, system-ui" font-size="11">Deduplicates Bangalore/Kolkata postings in 24h window</text>

        <!-- Step 2 -->
        <rect x="24" y="135" width="392" height="58" rx="8" fill="#1e1e2d" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
        <text x="44" y="164" fill="#c084fc" font-family="ui-monospace, monospace" font-weight="600" font-size="13">02 // Gemini MCP Evaluation</text>
        <text x="44" y="182" fill="#71717a" font-family="ui-sans-serif, system-ui" font-size="11">Ranks match score, seniority &amp; tech stack alignment</text>

        <!-- Step 3 -->
        <rect x="24" y="205" width="392" height="58" rx="8" fill="#1e1e2d" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
        <text x="44" y="234" fill="#34d399" font-family="ui-monospace, monospace" font-weight="600" font-size="13">03 // Document Generation &amp; Email</text>
        <text x="44" y="252" fill="#71717a" font-family="ui-sans-serif, system-ui" font-size="11">Generates moderncv PDF &amp; delivers Excel digest twice daily</text>
      </g>
    </g>
  </g>

  <!-- Title overlay on bottom -->
  <text x="140" y="625" fill="#f4f4f5" font-family="ui-sans-serif, system-ui" font-weight="700" font-size="20">AI Job Search Assistant</text>
  <text x="440" y="625" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="14">Python • Gemini API • MCP • LaTeX • GitHub Actions</text>
</svg>
